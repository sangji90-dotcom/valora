<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>발로라 제품 임시 도식</title>
<style>
  /*
   * 제품 대표 이미지 — 임시 도식.
   *
   * 실물 촬영본이 오기 전까지 쓰는 그림입니다. 생산과 디자인이
   * 확정된 뒤에 찍은 사진으로 교체합니다.
   *
   * ⚠ 사진처럼 보이게 만들지 않습니다.
   *   그림자·반사·질감을 넣어 실물처럼 만들면, 받아보는 쪽이
   *   "이런 제품이 이미 있다" 고 읽습니다. 선과 평면 색만 씁니다.
   *
   * ⚠ 타사 제품 사진을 보고 그리지 않습니다.
   *   형태는 제품 사양(src/content/products/*.md)에 적힌 것만
   *   따릅니다 — 캡슐 개수, 케이스 형태, 색상 선택지.
   *
   * 비율은 4:3 (site.config 의 layout.imageRatio) 입니다.
   */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; font-family: 'Pretendard Variable', 'Noto Sans CJK KR', sans-serif; }

  .shot {
    width: 960px;
    height: 720px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f8f6;
  }
  .shot svg { width: 100%; height: 100%; display: block; }

  .tag {
    position: absolute;
    left: 26px; top: 26px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #1b4a35;
    background: #d7e8de;
    border-radius: 999px;
    padding: 8px 16px;
  }

  /* 썸네일 판본 — 설명 글자를 뺍니다 (shoot 스크립트가 켭니다) */
  body.plain .cap { display: none; }

  /*
   * 썸네일에서는 배지를 크게 키웁니다.
   *
   * 카드 폭이 260px 안팎까지 줄어듭니다. 원본 960px 에서 20px 로 두면
   * 화면에서 5px 이 되어 읽히지 않고, 읽히지 않는 글자는 얼룩으로만
   * 보입니다. 그 상태로는 도식을 실물 사진으로 오인하게 됩니다.
   */
  body.plain .tag {
    font-size: 27px;
    padding: 12px 24px;
    left: 28px;
    top: 28px;
    letter-spacing: 0.03em;
    background: rgba(215, 232, 222, 0.92);
  }
</style>
</head>
<body>

<!-- ======================= 1. 리필 캡슐 ======================= -->
<div class="shot" id="capsule-refill">
  <span class="tag">시안 · 실물 사진 아님</span>
  <svg viewBox="0 0 960 720">
    <rect width="960" height="720" fill="#f4f8f6"/>

    <!-- 바닥선 -->
    <line x1="150" y1="448" x2="810" y2="448" stroke="#c9ddd3" stroke-width="2"/>

    <!-- 캡슐 3알: 용도별 색 구분 -->
    <g>
      <!-- 뒤 왼쪽 -->
      <ellipse cx="330" cy="374" rx="96" ry="76" fill="#dce9f5" stroke="#17241d" stroke-width="5"/>
      <path d="M262 344 q30 -26 66 -26" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
      <text x="330" y="382" font-size="21" font-weight="700" fill="#17241d" text-anchor="middle">BODY</text>
      <!-- 뒤 오른쪽 -->
      <ellipse cx="630" cy="374" rx="96" ry="76" fill="#f3dfe3" stroke="#17241d" stroke-width="5"/>
      <path d="M562 344 q30 -26 66 -26" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
      <text x="630" y="382" font-size="21" font-weight="700" fill="#17241d" text-anchor="middle">SOAP</text>
      <!-- 앞 가운데 -->
      <ellipse cx="480" cy="290" rx="112" ry="88" fill="#d9ece2" stroke="#17241d" stroke-width="6"/>
      <path d="M402 256 q34 -30 76 -30" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" opacity="0.9"/>
      <text x="480" y="299" font-size="25" font-weight="700" fill="#17241d" text-anchor="middle">SHAMPOO</text>
    </g>

    <!-- 설명 -->
    <text x="480" y="610" class="cap" font-size="30" font-weight="800" fill="#17241d" text-anchor="middle">수용성 필름 · 1회 1캡슐</text>
    <text x="480" y="650" class="cap" font-size="22" fill="#49554e" text-anchor="middle">물에 닿으면 3~5초 만에 녹습니다</text>
  </svg>
</div>

    <g stroke="#17241d" stroke-width="3.5">

      <ellipse cx="661" cy="336" rx="42" ry="33" fill="#dce9f5"/>
      <ellipse cx="519" cy="436" rx="42" ry="33" fill="#f3dfe3"/>
      <ellipse cx="661" cy="436" rx="42" ry="33" fill="#f6eedb"/>

    <text x="480" y="616" class="cap" font-size="30" font-weight="800" fill="#17241d" text-anchor="middle">캡슐 4개 + 하드케이스</text>
    <text x="480" y="656" class="cap" font-size="22" fill="#49554e" text-anchor="middle">핑크 / 블랙 매트 · 외관 로고 인쇄 가능</text>
  </svg>
</div>

<!-- ======================= 3. 슬라이드 키트 ======================= -->

    <!-- 슬라이드 케이스: 바깥 슬리브 + 밀려 나온 속통 -->

    <rect x="452" y="206" width="268" height="168" rx="14" fill="#f2efe6" stroke="#17241d" stroke-width="5"/>
    <g stroke="#17241d" stroke-width="3.5">
      <ellipse cx="548" cy="290" rx="44" ry="35" fill="#d9ece2"/>

    <rect x="232" y="192" width="268" height="196" rx="18" fill="#b8352f" stroke="#17241d" stroke-width="5"/>

    <text x="366" y="300" font-size="24" font-weight="800" fill="#f0cfcd" text-anchor="middle" letter-spacing="4">LOGO</text>

    <!-- 미는 방향 -->

      <line x1="548" y1="430" x2="672" y2="430"/>
      <polyline points="652,416 672,430 652,444"/>

    <text x="480" y="616" class="cap" font-size="30" font-weight="800" fill="#17241d" text-anchor="middle">캡슐 2개 + 슬라이드 케이스</text>
    <text x="480" y="656" class="cap" font-size="22" fill="#49554e" text-anchor="middle">레드 / 블랙 / 아이보리 · 슬림형</text>
  </svg>
</div>

</body>
</html>
